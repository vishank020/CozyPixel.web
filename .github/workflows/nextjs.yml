name: Check and deploy to Pages

on:
  # Deploy whenever main changes
  push:
    branches: ["main"]
  # Run the same checks on pull requests (no deploy)
  pull_request:
  # Daily refresh, so wallpapers added or removed upstream show up within a day (PLAN A-21)
  schedule:
    - cron: "0 3 * * *"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One deploy at a time (never cancel one midway); pull request runs are cancelled by newer pushes
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Quality gate + Pages build: nothing deploys unless every check passes
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
      # Use Playwright's bundled Chromium instead of an installed Chrome
      PW_CHANNEL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A GitHub API hiccup shouldn't block a deploy: fall back to the committed manifest
      - name: Refresh wallpaper manifest
        id: manifest
        continue-on-error: true
        run: pnpm run generate-manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn if the manifest could not be refreshed
        if: steps.manifest.outcome == 'failure'
        run: echo "::warning::Manifest refresh failed; building from the committed data/manifest.json"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Palette contrast
        run: pnpm contrast

      - name: Build for tests (no basePath)
        run: pnpm build:preview

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Keep test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: .perf/test-results
          retention-days: 7

      # Uses the manifest from the refresh step (build:local skips prebuild's regeneration)
      - name: Build for GitHub Pages
        if: github.event_name != 'pull_request'
        run: pnpm build:local

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
